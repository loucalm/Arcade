<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!--
      Gabarit Web de Kenta (borne Anatidae). Deux règles :
      1. La page ne défile jamais : pas de marge, rien ne déborde, le jeu remplit la fenêtre (bandes noires si elle
         n'est pas en 16:9).
      2. Le jeu est toujours rendu en 1920×1080 exactement, quelle que soit la mise à l'échelle de Windows (125 %,
         150 %…) : l'image est seulement étirée à l'affichage. Avec le gabarit Minimal, le canvas faisait 1920×1080 px
         CSS : la page débordait (défilement) et Unity rendait en 1920×1080 × l'échelle (jusqu'à 2880×1620), trop
         pour le GPU intégré de la borne.
    -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #unity-canvas {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16));
        background: #000; image-rendering: pixelated; outline: none; display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // taille de rendu fixe (1920×1080, les attributs du canvas) : elle ne suit pas la taille affichée
        matchWebGLToCanvasSize: false,
        devicePixelRatio: 1,
      }).then(function () {
        canvas.focus();
      }).catch(function (message) {
        console.error(message);
      });
      // la page ne doit jamais défiler, même avec les touches fléchées ou la molette
      window.addEventListener("keydown", function (e) {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "PageUp", "PageDown", "Home", "End"].indexOf(e.key) >= 0) e.preventDefault();
      }, { passive: false });
      window.addEventListener("wheel", function (e) { e.preventDefault(); }, { passive: false });
    </script>
  </body>
</html>
